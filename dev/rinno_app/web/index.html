<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Acompanhe sua instalação solar Rinnovare.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rinnovare">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=20261020"/>

  <title>Rinnovare</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body { margin:0; background:#0b132b; }
    #app-loading { position:fixed; inset:0; display:grid; place-items:center; color:#fff;
      background:linear-gradient(135deg,#0b132bd9,#132c4070,#0b132be6),url('assets/assets/solar.png') center/cover; font:13px system-ui,sans-serif; }
    .loading-content { width:min(260px,70vw); text-align:center; animation:reveal .65s cubic-bezier(.22,1,.36,1) both; }
    .loading-symbol { width:min(200px,50vw); height:auto; filter:drop-shadow(0 3px 10px #0005); }
    .loading-track { height:4px; margin-top:32px; background:#ffffff30; border-radius:8px; overflow:hidden; }
    .loading-track::after { content:''; display:block; height:100%; width:40%; border-radius:8px; background:#58e514; animation:progress 1.4s ease-in-out infinite; }
    .loading-content p { margin-top:18px; color:#ffffffb3; }
    @keyframes progress { from { transform:translateX(-110%); } to { transform:translateX(350%); } }
    @keyframes reveal { from { opacity:0; transform:scale(.94); } to { opacity:1; transform:scale(1); } }
    @media(prefers-reduced-motion:reduce) { .loading-content,.loading-track::after { animation:none; } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Carregando aplicativo">
    <div class="loading-content">
      <img class="loading-symbol" src="rinnovare-symbol.png" alt="Rinnovare" width="200" height="200">
      <div class="loading-track" aria-hidden="true"></div>
      <p>Carregando sua energia…</p>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=graph-mobile-20261026" async></script>
</body>
</html>
