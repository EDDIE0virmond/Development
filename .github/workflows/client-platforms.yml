name: Client portal platforms
on:
  pull_request:
    paths: ['dev/rinno_app/**', '.github/workflows/client-platforms.yml']
  push:
    branches: [codex/client-portal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: web, command: 'flutter build web --release', artifact: 'build/web'}
          - {os: ubuntu-latest, target: android, command: 'flutter build apk --debug', artifact: 'build/app/outputs/flutter-apk/app-debug.apk'}
          - {os: windows-latest, target: windows, command: 'flutter build windows --release', artifact: 'build/windows/x64/runner/Release'}
          - {os: macos-latest, target: ios, command: 'flutter build ios --release --no-codesign', artifact: 'build/ios/iphoneos'}
          - {os: macos-latest, target: macos, command: 'flutter build macos --release', artifact: 'build/macos/Build/Products/Release'}
          - {os: ubuntu-latest, target: linux, command: 'flutter build linux --release', artifact: 'build/linux/x64/release/bundle'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dev/rinno_app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Linux native dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - run: flutter test
      - run: ${{ matrix.command }} --dart-define=API_BASE_URL=https://api.rinnovare.com.br/api/v1/app
      - uses: actions/upload-artifact@v4
        with:
          name: rinnovare-${{ matrix.target }}
          path: dev/rinno_app/${{ matrix.artifact }}
          if-no-files-found: error
